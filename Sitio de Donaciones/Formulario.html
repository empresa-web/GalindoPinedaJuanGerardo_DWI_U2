<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Donaciones</title>
    <link rel="stylesheet" href="style3.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Viajes Sostenibles y Turismo Responsable</h1>
        <nav>
            <ul>
                <li><a href="Donaciones.html">Historia y Misión</a></li>
                <li><a href="Informacion.html">Información Sobre Donaciones</a></li>
                <li><a href="Formulario.html">Formulario</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="form-container">
            <center><h1>Formulario de Donaciones</h1></center>
            <form id="donationForm" action="/--submit" method="post">
                <fieldset>
                    <legend>Información del Donante</legend>
                    <center><label for="nombre">Nombre:</label></center>
                    <center><input type="text" id="nombre" name="nombre" class="grande" required></center>
                    <br><br>
                    <center><label for="email">Correo electrónico:</label></center>
                    <center><input type="email" id="email" name="email" class="grande" required></center>
                    <br><br>
                    <center><label for="telefono">Número de Teléfono:</label></center>
                    <center><input type="tel" id="telefono" name="telefono" class="mediano" required></center>
                    <br><br>
                    <center><label for="fecha_donacion">Fecha de la Donación:</label></center>
                    <center><input type="date" id="fecha_donacion" name="fecha_donacion" class="pequeno" required></center>
                    <br><br>
                    <center><label for="monto">Monto de la Donación:</label></center>
                    <center><input type="number" id="monto" name="monto" min="0" step="0.01" class="pequeno" required></center>
                    <br><br>
                    <center><label for="frecuencia">Frecuencia de la Donación:</label></center>
                    <center>
                        <select id="frecuencia" name="frecuencia" required>
                            <option value="unica">Única</option>
                            <option value="mensual">Mensual</option>
                            <option value="anual">Anual</option>
                        </select>
                    </center>
                    <br><br>
                    <center><label for="metodo_pago">Método de Pago:</label></center>
                    <center>
                        <input type="checkbox" id="efectivo" name="metodo_pago" value="efectivo">
                        <label for="efectivo">Efectivo</label>
                        <input type="checkbox" id="cheque" name="metodo_pago" value="cheque">
                        <label for="cheque">Cheque</label>
                        <input type="checkbox" id="tarjeta_credito" name="metodo_pago" value="tarjeta_credito">
                        <label for="tarjeta_credito">Tarjeta de Crédito</label>
                        <input type="checkbox" id="transferencia" name="metodo_pago" value="transferencia">
                        <label for="transferencia">Transferencia Bancaria</label>
                    </center>
                    <br><br>
                    <center><label for="motivo">Motivo de la Donación:</label></center>
                    <center><textarea name="motivo" id="motivo" rows="5" class="grande" required onfocus="showPlaceholder();" oninput="hidePlaceholder();"></textarea></center>
                    <br><br>
                    <center><label for="preferencias_contacto">Preferencias de Contacto:</label></center>
                    <center>
                        <input type="checkbox" id="email_contacto" name="preferencias_contacto" value="email">
                        <label for="email_contacto">Correo electrónico</label>
                        <input type="checkbox" id="telefono_contacto" name="preferencias_contacto" value="telefono">
                        <label for="telefono_contacto">Teléfono</label>
                        <input type="checkbox" id="correo_postal_contacto" name="preferencias_contacto" value="correo_postal">
                        <label for="correo_postal_contacto">Correo Postal</label>
                    </center>
                    <br><br>
                    <center><label for="consentimiento">Consentimiento para recibir información sobre Anuncios de la Fundación por correo:</label></center>
                    <center><input type="checkbox" id="consentimiento" name="consentimiento"></center>
                    <br><br>
                    <div class="button-container">
                        <button type="submit">Enviar</button>
                        <button type="reset">Limpiar</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Juan Gerardo Galindo Pineda. Todos los derechos reservados</p>
    </footer>
</body>
</html>
